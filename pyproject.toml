[project]
name = "curry-nomad"
version = "0.1.0"
description = "Nora — an agentic-workflows case study (LangGraph/LangChain teaching artifact)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core LangChain / LangGraph (1.x). Provider-agnostic: models are built from
    # config strings via init_chat_model, never by importing a provider SDK directly.
    "langchain>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
    # OpenAI is the default provider (chat + embeddings). Anthropic is a one-line
    # switch via the optional extra below — no code change.
    "langchain-openai>=0.3",
    # Config, contracts, logging, retries.
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "tenacity>=8.3",
]

[project.optional-dependencies]
# Switch the model layer to Claude with: `uv sync --extra anthropic` then
# set NORA_MODEL=anthropic:claude-sonnet-4-6 (and ANTHROPIC_API_KEY) in .env.
anthropic = ["langchain-anthropic>=0.3"]
# The real text-to-video renderer (M7) talks to OpenRouter over HTTP.
openrouter = ["httpx>=0.27"]
aegra = [
    "aegra-cli>=0.1",
]

[dependency-groups]
# Installed by `uv sync` by default. langgraph-cli powers `langgraph dev` (M4).
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "langgraph-cli[inmem]>=0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nora"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
# Teaching code keeps a few long, explanatory prompt strings and example rows.
ignore = ["E501"]

[tool.pytest.ini_options]
# Belt-and-suspenders: import `nora.*` (from src) and `tests.*` (shared fakes) without
# requiring an editable install.
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"
