[project]
name = "curry-nomad"
version = "0.1.0"
description = "Nora — an agentic-workflows case study (LangGraph/LangChain teaching artifact)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core LangChain / LangGraph (1.x). Provider-agnostic: models are built from
    # config strings via init_chat_model, never by importing a provider SDK directly.
    "langchain>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
    # OpenAI is the default provider (chat + embeddings). Anthropic is a one-line
    # switch via the optional extra below — no code change.
    "langchain-openai>=0.3",
    # Config, contracts, logging, retries.
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "tenacity>=8.3",
]

[project.optional-dependencies]
# Switch the model layer to Claude with: `uv sync --extra anthropic` then
# set NORA_MODEL=anthropic:claude-sonnet-4-6 (and ANTHROPIC_API_KEY) in .env.
anthropic = ["langchain-anthropic>=0.3"]
# The real text-to-video renderer (M7) talks to OpenRouter over HTTP.
openrouter = ["httpx>=0.27"]
# Optional Langfuse tracing. Enable with `uv sync --extra langfuse`, then set the LANGFUSE_*
# env vars (see .env.example) — the CLI attaches a LangChain CallbackHandler and traces the run.
langfuse = ["langfuse>=3"]
# Phase-1 operations system: a small FastAPI REST API in front of the deterministic
# inventory/orders/routing services. Kept an optional extra (like anthropic/langfuse) so the base
# install + offline graph tests stay dependency-light. Enable: `uv sync --extra operations`.
operations = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",  # Starlette's TestClient (used by the offline API tests) needs it
]

[project.scripts]
# Build the writable operations DB (deterministic; safe to re-run). Needs no provider key.
nora-ops-seed = "nora.operations.seed:main"
# Serve the operations REST API on :8000 (thin uvicorn.run wrapper). Needs `--extra operations`.
nora-ops-api = "nora.operations.api:run"

[dependency-groups]
# Installed by `uv sync` by default. langgraph-cli powers `langgraph dev` (M4).
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "langgraph-cli[inmem]>=0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/nora/src/nora"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps/nora/src", "apps/nora/tests", "apps/nora/evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
# Teaching code keeps a few long, explanatory prompt strings and example rows.
ignore = ["E501"]

[tool.pytest.ini_options]
# Belt-and-suspenders: import `nora.*` (from apps/nora/src) plus `tests.*` / `evals.*`
# (shared fakes + suites, from apps/nora) without requiring an editable install.
pythonpath = ["apps/nora/src", "apps/nora"]
testpaths = ["apps/nora/tests"]
addopts = "-q"
