# The whole Nora app in containers: Postgres + Aegra backend + store seed + web UI.
#
#   cp .env.example .env          # add OPENAI_API_KEY (the backend won't boot without it)
#   docker compose up --build     # → open http://localhost:3000
#
# Flow: browser → web (:3000) → Aegra (:2026, the `nora` graph over the Agent Protocol)
#       → Postgres (checkpointer for HITL + semantic Store). The `seed` one-shot loads
#       brand voice + metric definitions into the Store once the API is healthy.
#
# Optional Langfuse tracing of this containerized backend: bring up the Langfuse stack
# (`docker compose -f docker-compose.langfuse.yml up -d`, UI on :3001), then set in .env:
#   OTEL_TARGETS=LANGFUSE
#   LANGFUSE_BASE_URL=http://host.docker.internal:3001   # reach the host-published Langfuse
#   LANGFUSE_PUBLIC_KEY=pk-lf-nora-public
#   LANGFUSE_SECRET_KEY=sk-lf-nora-secret
# Aegra auto-instruments LangChain over OTEL and groups traces by thread (Sessions view).

services:
  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-aegra}
    volumes:
      # Postgres 18 places PGDATA in a versioned subdir; mount the parent (not /data).
      - nora_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  aegra:
    build:
      context: .
      dockerfile: Dockerfile
    image: curry-nomad-aegra:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-aegra}
      AEGRA_CONFIG: /app/aegra.json
      HOST: 0.0.0.0
      PORT: "2026"
      # Single-instance demo: in-process event broker (no Redis service needed).
      REDIS_BROKER_ENABLED: "false"
      # Tracing is opt-in (empty = off). See the Langfuse note at the top of this file.
      OTEL_TARGETS: ${OTEL_TARGETS:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-http://host.docker.internal:3001}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "2026:2026"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:2026/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s

  # One-shot: seed brand voice + metric definitions into the running Store, then exit.
  seed:
    image: curry-nomad-aegra:latest
    restart: "no"
    command: ["python", "apps/nora/scripts/seed_store.py"]
    environment:
      AEGRA_URL: http://aegra:2026
    depends_on:
      aegra:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_AEGRA_URL: ${NEXT_PUBLIC_AEGRA_URL:-http://localhost:2026}
        NEXT_PUBLIC_ASSISTANT_ID: ${NEXT_PUBLIC_ASSISTANT_ID:-nora}
    image: curry-nomad-web:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      aegra:
        condition: service_started

volumes:
  nora_postgres_data:
