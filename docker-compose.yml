# The whole Nora app in containers: Postgres + Aegra backend + Store seed + operations API + web UI.
#
#   cp .env.example .env          # add OPENAI_API_KEY (the backend won't boot without it)
#   docker compose up --build     # → chat at http://localhost:3000, inventory at /inventory
#
# Flow:
#   browser → web (:3000) → aegra (:2026, the `nora` graph over the Agent Protocol) → postgres
#     (durable checkpointer for HITL + the semantic Store) for chat, and
#   browser → web (/inventory) → ops-api (:8000, the deterministic operations REST API) for
#   inventory + orders + delivery routing. The `seed` one-shot loads brand voice + metric
#   definitions into the Store once Aegra is healthy; ops-api rebuilds its own ephemeral SQLite on
#   start. The operations system has NO LLM, so ops-api needs no API key.
#
# Optional tracing: Aegra auto-instruments LangChain over OpenTelemetry. Bring up the Langfuse
# stack (`docker compose -f docker-compose.langfuse.yml up -d`, UI on :3001) and set in .env:
#   OTEL_TARGETS=LANGFUSE
#   LANGFUSE_BASE_URL=http://host.docker.internal:3001
#   LANGFUSE_PUBLIC_KEY=pk-lf-nora-public
#   LANGFUSE_SECRET_KEY=sk-lf-nora-secret
# Traces group by thread in the Langfuse Sessions view.

services:
  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aegra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegra}
      POSTGRES_DB: ${POSTGRES_DB:-aegra}
    ports:
      # Publish to the host so the NATIVE `aegra dev` process (which runs outside the docker network)
      # can reach Postgres at localhost:5432. The dockerized stack connects via the `postgres` service
      # name on the internal network and is unaffected by this.
      - "5432:5432"
    volumes:
      # Postgres 18 places PGDATA in a versioned subdir; mount the parent (not /data).
      - nora_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aegra}"]
      interval: 5s
      timeout: 5s
      retries: 10

  aegra:
    build:
      context: .
      dockerfile: Dockerfile
    image: curry-nomad-aegra:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: "2026"
      DATABASE_URL: postgresql://${POSTGRES_USER:-aegra}:${POSTGRES_PASSWORD:-aegra}@postgres:5432/${POSTGRES_DB:-aegra}
      # Single-instance demo: in-process asyncio runs (no Redis service needed).
      REDIS_BROKER_ENABLED: "false"
      # Auth is OFF by default (keyless local dev). Set AUTH_TYPE=custom in .env to enable the
      # per-operator identity handler (auth.py) — required only for the Google Workspace demo, which
      # also needs NEXTAUTH_SECRET (the secret the web app signs its session JWTs with).
      AUTH_TYPE: ${AUTH_TYPE:-noop}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-}
      # Workspace capability (OFF by default): point Aegra at the MCP server and flip the flag in .env.
      NORA_WORKSPACE_ENABLED: ${NORA_WORKSPACE_ENABLED:-false}
      NORA_WORKSPACE_MCP_URL: ${NORA_WORKSPACE_MCP_URL:-http://workspace-mcp:8001/mcp}
      # Tracing is opt-in (empty = off). See the Langfuse note at the top of this file.
      OTEL_TARGETS: ${OTEL_TARGETS:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-http://host.docker.internal:3001}
      # Generated marketing media (OpenRouter renderer) lands here, on a volume shared with ops-api
      # (which serves it at /media). Fixed path so it's independent of the package location.
      NORA_MEDIA_DIR: /media-data
    volumes:
      - nora_media:/media-data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "2026:2026"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:2026/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s

  # One-shot: seed the GLOBAL memory tier (brand voice + metric definitions), then exit. Writes
  # STRAIGHT to Postgres (not via Aegra's REST store, which would rewrite the namespace under
  # users/<id> so the graph's raw read would miss it). Waits for aegra healthy so the store schema
  # exists, then connects directly via DATABASE_URL. Embeds each value → needs OPENAI_API_KEY (.env).
  seed:
    image: curry-nomad-aegra:latest
    restart: "no"
    env_file:
      - path: .env
        required: false
    command: ["python", "apps/nora/scripts/seed_global.py"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aegra}:${POSTGRES_PASSWORD:-aegra}@postgres:5432/${POSTGRES_DB:-aegra}
    depends_on:
      aegra:
        condition: service_healthy

  # The deterministic operations system (inventory + orders + delivery routing). Reuses the
  # aegra image (built with the `operations` extra); seeds its writable, ephemeral SQLite on
  # start, then serves the REST API the web /inventory page calls. No LLM → no API key needed.
  ops-api:
    image: curry-nomad-aegra:latest
    restart: unless-stopped
    command:
      - sh
      - -c
      - "python -m nora.operations.seed && exec uvicorn nora.operations.api:app --host 0.0.0.0 --port 8000"
    environment:
      # Serve generated marketing media from the same volume the aegra renderer writes to.
      NORA_MEDIA_DIR: /media-data
    volumes:
      - nora_media:/media-data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      # Only to ensure the shared image is built first; ops-api is otherwise independent.
      aegra:
        condition: service_started

  # Google Workspace MCP server — backs the optional `workspace` capability. External-OAuth-provider
  # + stateless mode: it has no token store and runs no OAuth flow itself; it validates the operator's
  # Google access token (which Nora passes as a bearer per run) and calls Google on their behalf.
  # Behind the `workspace` compose profile, so the default `docker compose up` stack is unchanged —
  # start it with `docker compose --profile workspace up`. Best-effort: if it's down, the workspace
  # capability degrades to a text reply (no hard depends_on from aegra).
  # NOTE: confirm the exact image/tag + flags against https://workspacemcp.com/docs (override with
  # WORKSPACE_MCP_IMAGE); build from github.com/taylorwilsdon/google_workspace_mcp if none fits.
  workspace-mcp:
    profiles: ["workspace"]
    image: ${WORKSPACE_MCP_IMAGE:-ghcr.io/taylorwilsdon/google_workspace_mcp:latest}
    restart: unless-stopped
    # Tool surface exposed by the server. The real boundary is the OAuth scopes the operator grants
    # (apps/web/lib/google.ts) — a tool only succeeds if the bearer token carries its scope. Levels:
    # gmail readonly|organize|drafts|send|full (cumulative), tasks readonly|manage|full, others
    # readonly|full. Matches the granted set: gmail.compose, documents, spreadsheets, tasks, calendar,
    # drive.*.
    # The image's ENTRYPOINT is `/bin/sh -c`, so the command must be ONE shell string (not separate
    # flag args, which would hit sh directly → "Illegal option --"). Invokes the server the same way
    # the image's default CMD does (`uv run main.py …`), plus our --permissions.
    command:
      - "uv run main.py --transport streamable-http --permissions gmail:send docs:full sheets:full tasks:full calendar:full drive:readonly"
    environment:
      PORT: "8001"
      MCP_ENABLE_OAUTH21: "true"
      EXTERNAL_OAUTH21_PROVIDER: "true"
      WORKSPACE_MCP_STATELESS_MODE: "true"
      # OAuth 2.1 reuses these even in external-provider mode (token validation); read from .env.
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    ports:
      - "8001:8001"
    # No healthcheck: the image has no curl/`/health` route, and nothing depends on it being
    # "healthy" — the workspace capability degrades to a text reply if the MCP server is down.

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:2026}
        NEXT_PUBLIC_ASSISTANT_ID: ${NEXT_PUBLIC_ASSISTANT_ID:-nora}
        NEXT_PUBLIC_OPS_API_URL: ${NEXT_PUBLIC_OPS_API_URL:-http://localhost:8000}
    image: curry-nomad-web:latest
    restart: unless-stopped
    environment:
      # Server-side only: the /api/render/video proxy polls + streams OpenRouter video jobs for the
      # marketing render card. Reuses the backend's render key (NORA_OPENROUTER_API_KEY in .env).
      OPENROUTER_API_KEY: ${NORA_OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${NORA_OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      aegra:
        condition: service_started
      ops-api:
        condition: service_started

volumes:
  nora_postgres_data:
  nora_media:
