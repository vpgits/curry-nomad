# The whole Nora app in containers: `langgraph dev` backend + store seed + web UI.
#
#   cp .env.example .env          # add OPENAI_API_KEY (the backend won't boot without it)
#   docker compose up --build     # → open http://localhost:3000
#
# Flow: browser → web (:3000) → backend (:2024, the `nora` graph over the Agent Protocol via
#       `langgraph dev`). The dev server keeps state in-memory (no Postgres), so threads/store
#       reset on restart — the `seed` one-shot reloads brand voice + metric definitions into the
#       Store once the API is healthy.
#
# Optional tracing: `langgraph dev` integrates LangSmith natively — set LANGSMITH_TRACING=true
# and LANGSMITH_API_KEY in .env and runs show up in LangSmith automatically.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: curry-nomad-backend:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: "2024"
    ports:
      - "2024:2024"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:2024/ok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # One-shot: seed brand voice + metric definitions into the running Store, then exit.
  seed:
    image: curry-nomad-backend:latest
    restart: "no"
    command: ["python", "apps/nora/scripts/seed_store.py"]
    environment:
      NORA_API_URL: http://backend:2024
    depends_on:
      backend:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:2024}
        NEXT_PUBLIC_ASSISTANT_ID: ${NEXT_PUBLIC_ASSISTANT_ID:-nora}
    image: curry-nomad-web:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started
